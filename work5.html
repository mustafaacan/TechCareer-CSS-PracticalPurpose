<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List, Table, Size Units</title>
    <link rel="stylesheet" href="./work5.css" />
  </head>
  <body>
    <ul>
      <li>Home</li>
      <li>About Us</li>
      <li>Products</li>
      <li>Blog</li>
      <li>Register</li>
      <li>Login</li>
      <li>Contact Us</li>
    </ul>

    </hr>
    </br>

    <table>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
      </tr>
      <tr>
        <td>Laptop</td>
        <td>$999</td>
        <td>10</td>
      </tr>
      <tr>
        <td>Smartphone</td>
        <td>$699</td>
        <td>25</td>
      </tr>
      <tr>
        <td>Tablet</td>
        <td>$499</td>
        <td>15</td>
      </tr>
    </table>

  </body>
</html>
