  <body>
    <!-- 
    Transaction (Transition) : form animation effect between 2 or more options. It is important to use "transition" property in CSS as rigth way.
    Transform : without changing the object's place, using some functions such rotate(),  tranlate(), scale() etc.
    -->
    <p>both text and backcolor will be changed simultaneously</p>
    <button id="buttonID">Transaction</button>
  </hr>
  </br>
    <p>
      Area 1 text color will be changed immediately, backcolor will be change
      slowly
    </p>
    <div id="boxID">AREA 1</div>
    </hr>
    </br>
    <p>Transform example: rotate, scale, translate</p>
    <div id="transformID">TRANSFORM AREA</div>
  </body>
