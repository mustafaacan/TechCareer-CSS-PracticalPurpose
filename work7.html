<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Root, Selector</title>
    <link rel="stylesheet" href="./work7.css" />
  </head>
  <body>
    <!-- Root is an efficient method for frequently used properties. Root has higher level importance than the HTML 
     In other words, system will check the root properties first-->

    <!-- Selectors should be used to detect the needed element inside HTML to apply
     css properties -->

    <!-- Clear Fix can be use to prevent the negative impact of Float usage 
     Float is usable for old browser compatibility. for newer browsers grid and flex can be used-->

    <img class="rigth" src="./assets/email.jpeg" alt="email" />
    <img class="left" src="./assets/example.png" alt="example" />
    <img class="clear" src="./assets/robot.jpeg" alt="robot" />
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Corporis,
      incidunt.
    </p>

    </hr>
    </br>

    <p>paragraph-1</p>
    <div>
        <p>paragraph-2</p>
        <p>paragraph-3</p>
    </div>
    <p class="last">paragraph-4</p>

  </body>
</html>
