<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox</title>
    <link rel="stylesheet" href="./work8.css" />
  </head>
  <body>
    <!-- Justify-content: Horizontal spacing between items. If the flexible direction is row, it is horizontal. 
     Align-items: Vertical spacing between items if the flexible direction is row. 
     If the direction is column, the effects are reversed.
     for each items, by adding order numbers, orders can be specified-->

    <div class="container">
      <div class="item item1">Item 1</div>
      <div class="item item2">Item 2</div>
      <div class="item item3">Item 3</div>
      <div class="item item4">Item 4</div>
    </div>
  </body>
</html>
